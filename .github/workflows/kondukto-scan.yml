name: Kondukto Scans

# SAST and container scans through the Kondukto CLI (kdt), on every commit pushed
# to any branch. The DAST scan is a separate workflow that runs on pull requests
# only: .github/workflows/invicti-scan.yml.
#
# Requires the repo secret INVICTI_API_TOKEN.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# The kdt CLI reads INVICTI_ASPM_HOST and INVICTI_ASPM_TOKEN. The host is not
# secret; the token is the same repo secret the DAST workflow uses.
env:
  INVICTI_ASPM_HOST: "https://platform-eu.invicti.com"
  INVICTI_ASPM_TOKEN: ${{ secrets.INVICTI_API_TOKEN }}

jobs:
  sast:
    name: SAST scan (Kondukto)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup KDT
        run: curl -sSL https://cli.kondukto.io | sh

      # The app is JavaScript and Python, so this uses semgrep; gosec in the
      # vendor example only reads Go. Change -t if your Kondukto instance has a
      # different SAST tool enabled for this project.
      - name: Run a SAST scan
        run: |
          kdt scan \
            -p "${{ github.event.repository.name }}" \
            -t semgrep \
            -b "${{ github.ref_name }}"

  container:
    name: CS scan (Kondukto)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup KDT
        run: curl -sSL https://cli.kondukto.io | sh

      # The site is static files in S3, so there is no image of its own to scan.
      # vuln-lab/Dockerfile cannot be built (its remote ADD is a planted flaw
      # that returns 404), so this scans the base image it starts from.
      - name: Run a CS scan
        run: |
          kdt scan \
            -p "${{ github.event.repository.name }}" \
            -t trivy \
            --image=python:latest \
            -b "${{ github.ref_name }}"
